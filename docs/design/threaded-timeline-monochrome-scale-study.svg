<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <title>Threaded Timeline — monochrome scale study</title>
  <desc>Six geometric variants of three activity cards threaded by a vertical timeline, shown at 1024, 128, 64, 32, and 24 pixel scales.</desc>
  <style>
    .paper { fill: #fff; }
    .rule { stroke: #d7d7d7; stroke-width: 2; }
    .panel { fill: #fafafa; stroke: #dedede; stroke-width: 2; }
    .label { font: 700 28px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #111; }
    .spec { font: 18px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #555; }
    .size { font: 16px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #666; }
    .note { font: 20px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #333; }
    .card { fill: #000; }
    .thread-back { fill: none; stroke: #000; stroke-linecap: round; }
    .thread-front { fill: #fff; }
  </style>

  <rect class="paper" width="2400" height="1800"/>
  <text x="100" y="88" class="label" font-size="42">Threaded Timeline — monochrome scale study</text>
  <text x="100" y="124" class="note">Three equal Activity Cards. A straight Thread passes in front of the outer cards and behind the middle card.</text>
  <line class="rule" x1="100" y1="154" x2="2300" y2="154"/>

  <!-- Mark A: balanced baseline / 2.3 ratio / medium radius / 30% thread / 10% width / 20% gap -->
  <symbol id="mark-a" viewBox="0 0 1024 1024">
    <path class="thread-back" stroke-width="20" d="M408 92V932"/>
    <rect class="card" x="252" y="136" width="520" height="226" rx="38"/>
    <rect class="card" x="252" y="407" width="520" height="226" rx="38"/>
    <rect class="card" x="252" y="678" width="520" height="226" rx="38"/>
    <rect class="thread-front" x="398" y="136" width="20" height="226"/>
    <rect class="thread-front" x="398" y="678" width="20" height="226"/>
  </symbol>

  <!-- Mark B: wide / tight / small radius / 25% thread / 8% width / 15% gap -->
  <symbol id="mark-b" viewBox="0 0 1024 1024">
    <path class="thread-back" stroke-width="16" d="M364 110V914"/>
    <rect class="card" x="214" y="164" width="596" height="229" rx="20"/>
    <rect class="card" x="214" y="427" width="596" height="229" rx="20"/>
    <rect class="card" x="214" y="690" width="596" height="229" rx="20"/>
    <rect class="thread-front" x="356" y="164" width="16" height="229"/>
    <rect class="thread-front" x="356" y="690" width="16" height="229"/>
  </symbol>

  <!-- Mark C: compact / airy / large radius / 35% thread / 12% width / 25% gap -->
  <symbol id="mark-c" viewBox="0 0 1024 1024">
    <path class="thread-back" stroke-width="28" d="M442 75V949"/>
    <rect class="card" x="292" y="103" width="440" height="220" rx="78"/>
    <rect class="card" x="292" y="402" width="440" height="220" rx="78"/>
    <rect class="card" x="292" y="701" width="440" height="220" rx="78"/>
    <rect class="thread-front" x="428" y="103" width="28" height="220"/>
    <rect class="thread-front" x="428" y="701" width="28" height="220"/>
  </symbol>

  <!-- Mark D: balanced / airy / medium radius / 25% thread / 12% width / 25% gap -->
  <symbol id="mark-d" viewBox="0 0 1024 1024">
    <path class="thread-back" stroke-width="26" d="M374 69V955"/>
    <rect class="card" x="242" y="87" width="540" height="235" rx="42"/>
    <rect class="card" x="242" y="394" width="540" height="235" rx="42"/>
    <rect class="card" x="242" y="701" width="540" height="235" rx="42"/>
    <rect class="thread-front" x="361" y="87" width="26" height="235"/>
    <rect class="thread-front" x="361" y="701" width="26" height="235"/>
  </symbol>

  <!-- Mark E: wide / tight / medium radius / 35% thread / 10% width / 15% gap -->
  <symbol id="mark-e" viewBox="0 0 1024 1024">
    <path class="thread-back" stroke-width="23" d="M482 109V915"/>
    <rect class="card" x="212" y="160" width="600" height="231" rx="42"/>
    <rect class="card" x="212" y="426" width="600" height="231" rx="42"/>
    <rect class="card" x="212" y="692" width="600" height="231" rx="42"/>
    <rect class="thread-front" x="470.5" y="160" width="23" height="231"/>
    <rect class="thread-front" x="470.5" y="692" width="23" height="231"/>
  </symbol>

  <!-- Mark F: compact / balanced / small radius / 30% thread / 8% width / 20% gap -->
  <symbol id="mark-f" viewBox="0 0 1024 1024">
    <path class="thread-back" stroke-width="18" d="M408 91V933"/>
    <rect class="card" x="282" y="136" width="460" height="230" rx="18"/>
    <rect class="card" x="282" y="407" width="460" height="230" rx="18"/>
    <rect class="card" x="282" y="678" width="460" height="230" rx="18"/>
    <rect class="thread-front" x="399" y="136" width="18" height="230"/>
    <rect class="thread-front" x="399" y="678" width="18" height="230"/>
  </symbol>

  <!-- Panel helper: every row uses native relative scale from 1024px. -->
  <!-- A -->
  <g transform="translate(100 205)">
    <rect class="panel" width="690" height="710" rx="28"/>
    <text class="label" x="36" y="52">A — Balanced</text>
    <text class="spec" x="36" y="82">2.3× · r 17% · x 30% · Thread 10% · gap 20%</text>
    <use href="#mark-a" x="188" y="108" width="314" height="314"/>
    <line class="rule" x1="36" y1="458" x2="654" y2="458"/>
    <text class="size" x="36" y="492">128 px</text><use href="#mark-a" x="115" y="470" width="128" height="128"/>
    <text class="size" x="286" y="492">64 px</text><use href="#mark-a" x="346" y="502" width="64" height="64"/>
    <text class="size" x="447" y="492">32 px</text><use href="#mark-a" x="506" y="514" width="32" height="32"/>
    <text class="size" x="36" y="652">24 px</text><use href="#mark-a" x="94" y="632" width="24" height="24"/>
    <text class="size" x="188" y="652">1024 px master shown above</text>
  </g>

  <!-- B -->
  <g transform="translate(855 205)">
    <rect class="panel" width="690" height="710" rx="28"/>
    <text class="label" x="36" y="52">B — Wide / tight</text>
    <text class="spec" x="36" y="82">2.6× · r 9% · x 25% · Thread 8% · gap 15%</text>
    <use href="#mark-b" x="188" y="108" width="314" height="314"/>
    <line class="rule" x1="36" y1="458" x2="654" y2="458"/>
    <text class="size" x="36" y="492">128 px</text><use href="#mark-b" x="115" y="470" width="128" height="128"/>
    <text class="size" x="286" y="492">64 px</text><use href="#mark-b" x="346" y="502" width="64" height="64"/>
    <text class="size" x="447" y="492">32 px</text><use href="#mark-b" x="506" y="514" width="32" height="32"/>
    <text class="size" x="36" y="652">24 px</text><use href="#mark-b" x="94" y="632" width="24" height="24"/>
    <text class="size" x="188" y="652">1024 px master shown above</text>
  </g>

  <!-- C -->
  <g transform="translate(1610 205)">
    <rect class="panel" width="690" height="710" rx="28"/>
    <text class="label" x="36" y="52">C — Compact / airy</text>
    <text class="spec" x="36" y="82">2.0× · r 35% · x 35% · Thread 12% · gap 25%</text>
    <use href="#mark-c" x="188" y="108" width="314" height="314"/>
    <line class="rule" x1="36" y1="458" x2="654" y2="458"/>
    <text class="size" x="36" y="492">128 px</text><use href="#mark-c" x="115" y="470" width="128" height="128"/>
    <text class="size" x="286" y="492">64 px</text><use href="#mark-c" x="346" y="502" width="64" height="64"/>
    <text class="size" x="447" y="492">32 px</text><use href="#mark-c" x="506" y="514" width="32" height="32"/>
    <text class="size" x="36" y="652">24 px</text><use href="#mark-c" x="94" y="632" width="24" height="24"/>
    <text class="size" x="188" y="652">1024 px master shown above</text>
  </g>

  <!-- D -->
  <g transform="translate(100 980)">
    <rect class="panel" width="690" height="710" rx="28"/>
    <text class="label" x="36" y="52">D — Airy / left thread</text>
    <text class="spec" x="36" y="82">2.3× · r 18% · x 25% · Thread 12% · gap 25%</text>
    <use href="#mark-d" x="188" y="108" width="314" height="314"/>
    <line class="rule" x1="36" y1="458" x2="654" y2="458"/>
    <text class="size" x="36" y="492">128 px</text><use href="#mark-d" x="115" y="470" width="128" height="128"/>
    <text class="size" x="286" y="492">64 px</text><use href="#mark-d" x="346" y="502" width="64" height="64"/>
    <text class="size" x="447" y="492">32 px</text><use href="#mark-d" x="506" y="514" width="32" height="32"/>
    <text class="size" x="36" y="652">24 px</text><use href="#mark-d" x="94" y="632" width="24" height="24"/>
    <text class="size" x="188" y="652">1024 px master shown above</text>
  </g>

  <!-- E -->
  <g transform="translate(855 980)">
    <rect class="panel" width="690" height="710" rx="28"/>
    <text class="label" x="36" y="52">E — Wide / right thread</text>
    <text class="spec" x="36" y="82">2.6× · r 18% · x 35% · Thread 10% · gap 15%</text>
    <use href="#mark-e" x="188" y="108" width="314" height="314"/>
    <line class="rule" x1="36" y1="458" x2="654" y2="458"/>
    <text class="size" x="36" y="492">128 px</text><use href="#mark-e" x="115" y="470" width="128" height="128"/>
    <text class="size" x="286" y="492">64 px</text><use href="#mark-e" x="346" y="502" width="64" height="64"/>
    <text class="size" x="447" y="492">32 px</text><use href="#mark-e" x="506" y="514" width="32" height="32"/>
    <text class="size" x="36" y="652">24 px</text><use href="#mark-e" x="94" y="632" width="24" height="24"/>
    <text class="size" x="188" y="652">1024 px master shown above</text>
  </g>

  <!-- F -->
  <g transform="translate(1610 980)">
    <rect class="panel" width="690" height="710" rx="28"/>
    <text class="label" x="36" y="52">F — Compact / crisp</text>
    <text class="spec" x="36" y="82">2.0× · r 8% · x 30% · Thread 8% · gap 20%</text>
    <use href="#mark-f" x="188" y="108" width="314" height="314"/>
    <line class="rule" x1="36" y1="458" x2="654" y2="458"/>
    <text class="size" x="36" y="492">128 px</text><use href="#mark-f" x="115" y="470" width="128" height="128"/>
    <text class="size" x="286" y="492">64 px</text><use href="#mark-f" x="346" y="502" width="64" height="64"/>
    <text class="size" x="447" y="492">32 px</text><use href="#mark-f" x="506" y="514" width="32" height="32"/>
    <text class="size" x="36" y="652">24 px</text><use href="#mark-f" x="94" y="632" width="24" height="24"/>
    <text class="size" x="188" y="652">1024 px master shown above</text>
  </g>
</svg>
